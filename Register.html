<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="C:\Users\LENOVO\Documents\SBS School\Website\CSS\Register.css">
    <title>Register Form</title>
</head>
<body>
    <div class="form-container">
        <h2>Register Form</h2>
        <form id="registerForm">
            <label for="fullname">Full name</label>
            <input type="text" id="fullname" name="fullname" placeholder="Your full name" required><br><br>

            <label for="country">Your country</label>
            <input type="text" id="country" name="country" required><br><br>

            <label for="className">Class Name</label>
            <input type="text" id="className" name="className" required><br><br>

            <label>Gender</label>
            <label for="male"><input type="radio" id="male" name="gender" value="male"> Male</label>
            <label for="female"><input type="radio" id="female" name="gender" value="female"> Female</label><br><br>

            <label for="avatar">Your Avatar</label>
            <input type="file" id="avatar" name="avatar"><br><br>

            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
